# TFTP Server Configuration Test Fixture
# Tests TFTP subsystem implementation from src/tftp.c
# Validates tftp/server.rs, tftp/protocol.rs, and tftp/transfer.rs modules
#
# This configuration tests:
# - TFTP server activation and basic operation
# - Network boot (PXE) support
# - TFTP security features (path traversal prevention)
# - Per-client TFTP root directories
# - Block size negotiation
# - Port range configuration
# - Integration with DHCP for network boot

# =============================================================================
# TFTP Server Core Configuration
# =============================================================================

# Enable dnsmasq's built-in TFTP server
# Tests: TFTP server initialization and listener setup
enable-tftp

# Set the root directory for files available via TFTP
# Tests: File path resolution and serving
tftp-root=/var/lib/tftpboot

# Do not abort if the tftp-root directory is unavailable
# Tests: Graceful handling of missing root directory
tftp-no-fail

# Make the TFTP server more secure: only files owned by the user
# dnsmasq is running as will be sent over the network
# Tests: Permission checking and path traversal prevention
tftp-secure

# Set per-client TFTP root directories based on MAC address or client IP
# Format: tftp-unique-root=<interface-or-subnet>
# Tests: Dynamic root directory selection per client
tftp-unique-root=ip

# Set TFTP ephemeral port range for data transfers
# Tests: Port allocation and management for parallel transfers
tftp-port-range=4096,8192

# Disable TFTP block size negotiation for compatibility with broken clients
# Tests: Block size handling and negotiation logic
# Uncomment to test with block size negotiation disabled:
#tftp-no-blocksize

# =============================================================================
# PXE Boot Configuration
# =============================================================================

# Set the boot filename for PXE netboot clients
# Tests: DHCP integration and boot file specification
dhcp-boot=pxelinux.0

# Alternative boot configuration with external TFTP server
# Tests: External TFTP server specification
#dhcp-boot=pxelinux.0,boothost,192.168.1.100

# Configure different boot files based on client architecture
# Tests: Architecture detection and conditional boot file selection

# Detect client architecture via DHCP option 93 (RFC 4578)
dhcp-match=set:x86,option:client-arch,0      # x86-32
dhcp-match=set:x86_64,option:client-arch,6   # x86-64
dhcp-match=set:efi64,option:client-arch,7    # EFI x86-64
dhcp-match=set:efi32,option:client-arch,6    # EFI IA32
dhcp-match=set:arm64,option:client-arch,11   # ARM 64-bit

# Set boot files based on architecture
dhcp-boot=tag:x86,bios/pxelinux.0
dhcp-boot=tag:x86_64,bios/pxelinux.0
dhcp-boot=tag:efi64,efi64/syslinux.efi
dhcp-boot=tag:efi32,efi32/syslinux.efi
dhcp-boot=tag:arm64,arm64/bootaa64.efi

# =============================================================================
# PXE Service Menu Configuration
# =============================================================================

# PXE menu prompt with timeout (in seconds)
# Tests: PXE menu presentation and timeout handling
pxe-prompt="Press F8 for network boot menu", 10

# PXE service menu options
# Format: pxe-service=<CSA>,<menu text>[,<boot file>[,<server IP>]]
# Tests: PXE menu construction and service selection

# Boot from local disk (no boot file specified)
pxe-service=x86PC,Boot from local disk,0

# Load pxelinux from dnsmasq TFTP server
pxe-service=x86PC,Install Linux - BIOS,pxelinux

# Load from specific TFTP server
pxe-service=x86PC,Install Linux - Custom Server,pxelinux,192.168.1.100

# EFI boot services
pxe-service=BC_EFI,Boot EFI from local disk,0
pxe-service=X86-64_EFI,Install Linux - EFI64,grubx64.efi

# iPXE chainloading support
pxe-service=x86PC,Boot iPXE,undionly.kpxe

# =============================================================================
# iPXE Advanced Configuration
# =============================================================================

# Detect iPXE clients (iPXE sends option 175)
dhcp-match=set:ipxe,175

# Chainload different file when iPXE is detected
# Tests: Conditional boot file selection based on client capabilities
dhcp-boot=tag:ipxe,http://boot.example.com/menu.ipxe

# Encapsulated options for iPXE within option 175
# Tests: Encapsulated DHCP option handling
dhcp-option=encap:175,1,5b         # Priority code
dhcp-option=encap:175,176,1b       # no-proxydhcp
dhcp-option=encap:175,177,testnet  # bus-id

# =============================================================================
# PXE Client DHCP Options
# =============================================================================

# Vendor-class specific options for PXE clients
# Tests: Vendor-class filtering and option encapsulation
dhcp-option=vendor:PXEClient,1,0.0.0.0  # multicast TFTP server IP

# PXELinux-specific DHCP options (RFC 5071)
# Tests: Option force delivery even if not in parameter request list
dhcp-option-force=208,f1:00:74:7e          # Magic number
dhcp-option-force=209,configs/common       # Configuration file
dhcp-option-force=210,/tftpboot/pxelinux/  # Path prefix
dhcp-option-force=211,30i                  # Reboot time (seconds)

# Etherboot vendor class identification
dhcp-option=vendor:Etherboot,60,Etherboot

# =============================================================================
# TFTP Transfer Configuration
# =============================================================================

# Maximum number of concurrent TFTP transfers
# Tests: Connection limiting and resource management
#tftp-max=50

# TFTP transfer timeout in seconds
# Tests: Timeout handling and connection cleanup
#tftp-mtu=1468

# Enable TFTP on specific interface only
# Tests: Interface binding for TFTP server
#interface=eth0

# Listen on specific address for TFTP
# Tests: Address binding for TFTP listener
#listen-address=192.168.1.1

# =============================================================================
# Logging Configuration for TFTP Testing
# =============================================================================

# Log TFTP file transfers
# Tests: Transfer logging and debugging output
#log-dhcp
#log-queries

# Verbose TFTP logging for debugging
# Tests: Detailed TFTP operation logging
#tftp-verbose

# =============================================================================
# Network Boot Scenario Tests
# =============================================================================

# Scenario 1: Basic PXE boot with single boot file
# - Client requests boot via DHCP
# - Server responds with pxelinux.0
# - Client downloads pxelinux.0 via TFTP
# - Tests: Basic TFTP server and DHCP integration

# Scenario 2: Architecture-specific boot files
# - Client sends architecture option (93)
# - Server matches architecture and sends appropriate boot file
# - Client downloads architecture-specific bootloader
# - Tests: dhcp-match and conditional dhcp-boot

# Scenario 3: PXE menu with multiple options
# - Client displays PXE menu with timeout
# - User selects boot option or timeout expires
# - Server delivers selected boot file via TFTP
# - Tests: pxe-prompt and pxe-service

# Scenario 4: iPXE chainloading
# - Client downloads iPXE bootloader
# - iPXE identifies itself via option 175
# - Server sends iPXE-specific boot script URL
# - Tests: dhcp-match for iPXE and tag-based dhcp-boot

# Scenario 5: Secure TFTP with path traversal prevention
# - Client attempts to access files outside tftp-root
# - Server blocks access attempts
# - Only authorized files are served
# - Tests: tftp-secure path validation

# Scenario 6: Per-client TFTP root directories
# - Different clients get different tftp-root based on IP/MAC
# - Tests: tftp-unique-root client isolation

# Scenario 7: External TFTP server configuration
# - DHCP provides boot file and external TFTP server address
# - Client connects to external server for file download
# - Tests: dhcp-boot with server address parameter

# =============================================================================
# Integration with DHCP Configuration
# =============================================================================

# DHCP range for network boot testing (example)
# Tests: Complete DHCP+TFTP workflow
#dhcp-range=192.168.1.100,192.168.1.200,12h

# Static DHCP host for testing
# Tests: Static host assignment with PXE boot
#dhcp-host=11:22:33:44:55:66,192.168.1.150,boothost,infinite

# DNS configuration for boot server hostname resolution
# Tests: Hostname resolution in dhcp-boot configuration
#address=/boothost.example.com/192.168.1.1

# =============================================================================
# Error Handling and Edge Cases
# =============================================================================

# Test cases this configuration should validate:
#
# 1. TFTP Protocol Compliance (RFC 1350):
#    - RRQ (Read Request) packet handling
#    - WRQ (Write Request) rejection (if write disabled)
#    - DATA packet transmission with correct block numbers
#    - ACK packet reception and timeout handling
#    - ERROR packet generation for various conditions
#
# 2. TFTP Options Extension (RFC 2347, 2348, 2349):
#    - Block size negotiation (OACK packets)
#    - Timeout interval negotiation
#    - Transfer size option
#
# 3. Security:
#    - Path traversal attempts (../../../etc/passwd)
#    - Absolute path access attempts
#    - Symlink following behavior
#    - Permission verification with tftp-secure
#
# 4. Performance and Concurrency:
#    - Multiple simultaneous transfers
#    - Port allocation within tftp-port-range
#    - Transfer timeout and retry behavior
#    - Large file transfer handling
#
# 5. PXE Boot Integration:
#    - DHCP Discover/Offer/Request/Ack cycle with PXE options
#    - Boot filename delivery in DHCP responses
#    - PXE menu construction and presentation
#    - Architecture detection and boot file selection
#
# 6. Error Conditions:
#    - File not found (TFTP error code 1)
#    - Access violation (TFTP error code 2)
#    - Disk full (TFTP error code 3)
#    - Illegal TFTP operation (TFTP error code 4)
#    - Unknown transfer ID (TFTP error code 5)
#    - File already exists (TFTP error code 6)
#
# 7. Compatibility:
#    - Broken TFTP clients requiring tftp-no-blocksize
#    - Old PXE ROMs with limited option support
#    - Various bootloader implementations (PXELINUX, GRUB, iPXE)

# =============================================================================
# Test Validation Criteria
# =============================================================================

# This configuration file tests the Rust implementation of tftp.c ensuring:
#
# 1. Functional Equivalence:
#    - All TFTP protocol features match C implementation behavior
#    - Packet formats are byte-identical
#    - Timeout and retry logic matches C version
#    - Error codes and messages match C implementation
#
# 2. Memory Safety:
#    - No buffer overflows in packet parsing
#    - Safe handling of malformed TFTP packets
#    - Proper cleanup of transfer state on errors
#    - No use-after-free in concurrent transfer handling
#
# 3. Configuration Compatibility:
#    - All tftp-* options parsed identically to C version
#    - DHCP integration options (dhcp-boot, pxe-service) work identically
#    - Option precedence and interactions match C behavior
#
# 4. Performance:
#    - Transfer speeds comparable to C implementation
#    - Concurrent transfer handling without degradation
#    - Efficient port allocation and reuse
#
# 5. Platform Integration:
#    - Works with systemd socket activation
#    - Proper privilege dropping after port binding
#    - Signal handling for graceful shutdown
#
# Expected test outcomes:
# - TFTP server starts successfully with enable-tftp
# - Files are served from tftp-root directory
# - Path traversal attempts are blocked by tftp-secure
# - PXE boot sequence completes successfully
# - Multiple architectures receive correct boot files
# - All TFTP error conditions are handled gracefully
# - Configuration is 100% backward compatible with dnsmasq C version
