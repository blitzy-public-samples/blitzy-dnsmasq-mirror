# DNSSEC-enabled configuration for testing DNSSEC validation functionality
#
# This configuration tests the DNSSEC subsystem implementation (dns/dnssec/)
# matching the behavior of dnssec.c and dnssec-crypto.c from the C version.
# Tests signature validation, trust chain verification, and cryptographic
# primitives (RSA, ECDSA, Ed25519) using the ring crate.
#
# Requirements tested:
# - DNSSEC signature validation (dnssec.c → dns/dnssec/validation.rs)
# - Cryptographic primitives (dnssec-crypto.c → dns/dnssec/crypto.rs)
# - Trust anchor configuration (trust-anchors.conf integration)
# - Unsigned reply validation with DS record proofs
# - DNSSEC proxy forwarding to upstream resolvers
# - Timestamp validation control for systems with broken RTC

# Enable DNSSEC validation and caching
# This activates the DNSSEC subsystem and validates all DNS responses
# using signatures from DNSSEC-signed zones.
# Tests: dns/dnssec/validation.rs signature verification
dnssec

# Load trust anchors for DNSSEC validation
# The trust-anchors.conf file contains the root zone DS record
# which serves as the trust anchor for the DNSSEC chain of trust.
# This path should point to a trust anchors configuration file.
# Tests: Trust anchor loading and root zone validation
conf-file=trust-anchors.conf

# Validate unsigned DNS replies
# This option tells dnsmasq to verify that unsigned replies are legitimate
# by finding a secure proof that a DS record does not exist between the
# root and the domain. This prevents forgeries in unsigned domains at the
# cost of additional DNS queries for validation.
# Tests: DS record proof validation for unsigned zones
dnssec-check-unsigned

# Proxy DNSSEC validation to upstream servers
# When enabled, dnsmasq forwards the DNSSEC validation work to upstream
# resolvers instead of performing validation locally. This is useful when
# upstream resolvers are trusted to perform DNSSEC validation.
# Tests: DNSSEC query forwarding with DO bit preservation
proxy-dnssec

# Disable DNSSEC timestamp checking
# For systems with broken or incorrect real-time clocks (RTC), DNSSEC
# signature timestamp validation can fail. This option disables time-based
# validation while still verifying cryptographic signatures.
# Tests: Signature validation without temporal constraints
dnssec-no-timecheck

# Upstream DNS servers for forwarding
# Using public DNS servers that support DNSSEC
server=8.8.8.8
server=8.8.4.4
server=2001:4860:4860::8888
server=2001:4860:4860::8844

# Cache configuration for DNSSEC responses
# DNSSEC responses can be larger due to signatures, so adequate cache size
# is important for performance
cache-size=10000

# Log DNSSEC validation queries for testing verification
# This helps verify that DNSSEC validation is occurring correctly
log-queries

# Additional DNSSEC-related testing options

# Do not read /etc/resolv.conf - use only configured servers
# This ensures predictable behavior in testing environments
no-resolv

# Never forward plain names without dots
# This reduces unnecessary queries and is a best practice with DNSSEC
domain-needed

# Never forward addresses in private IP ranges
# Another best practice that reduces query load
bogus-priv

# Listen on localhost for testing
listen-address=127.0.0.1
listen-address=::1

# Use a specific port for isolated testing (optional)
# Uncomment to run on non-standard port during tests
#port=5353

# Enable debug mode for detailed DNSSEC operation logging (optional)
# Uncomment for verbose DNSSEC debugging during development
#log-debug
