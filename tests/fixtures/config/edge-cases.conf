# ============================================================================
# SECTION 3: Port Number Edge Cases
# ============================================================================

# Minimum port number (0 - disables DNS):
#port=0

# Maximum valid port number:
#port=65535

# Common privileged port:
#port=53

# High port number:
#port=54321

# Port specified multiple times (last one should win):
#port=5353
#port=5454


# ============================================================================
# SECTION 4: IPv4 Address Boundary Cases
# ============================================================================

# Minimum IPv4 address:
#listen-address=0.0.0.0

# Maximum IPv4 address:
#listen-address=255.255.255.255

# Localhost:
#listen-address=127.0.0.1

# Loopback boundaries:
#listen-address=127.0.0.0
#listen-address=127.255.255.255

# Private network boundaries (RFC 1918):
#listen-address=10.0.0.0
#listen-address=10.255.255.255
#listen-address=172.16.0.0
#listen-address=172.31.255.255
#listen-address=192.168.0.0
#listen-address=192.168.255.255

# Link-local addresses (RFC 3927):
#listen-address=169.254.0.0
#listen-address=169.254.255.255

# Multicast addresses:
#listen-address=224.0.0.0
#listen-address=239.255.255.255

# Broadcast address:
#listen-address=255.255.255.255


# ============================================================================
# SECTION 5: IPv6 Address Edge Cases
# ============================================================================

# IPv6 loopback:
#listen-address=::1

# IPv6 all zeros:
#listen-address=::

# IPv6 all ones:
#listen-address=ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# IPv6 link-local:
#listen-address=fe80::1

# IPv6 with compressed zeros:
#listen-address=2001:db8::1

# IPv6 with multiple compressions (testing parser):
#listen-address=2001:db8:0:0:0:0:0:1

# IPv6 with embedded IPv4:
#listen-address=::ffff:192.168.1.1

# IPv6 documentation prefix:
#listen-address=2001:db8:85a3::8a2e:370:7334

# IPv6 multicast:
#listen-address=ff02::1


# ============================================================================
# SECTION 6: DHCP Range Edge Cases
# ============================================================================

# Single IP DHCP range (start equals end):
#dhcp-range=192.168.1.100,192.168.1.100,24h

# Maximum lease time:
#dhcp-range=192.168.1.50,192.168.1.150,2147483647s

# Minimum lease time (infinite):
#dhcp-range=192.168.1.50,192.168.1.150,infinite

# Very short lease time (1 second):
#dhcp-range=192.168.1.50,192.168.1.150,1s

# Lease time with all units:
#dhcp-range=192.168.1.50,192.168.1.150,1w2d3h4m5s

# DHCPv6 range with maximum prefix length:
#dhcp-range=2001:db8::1,2001:db8::ffff,128,24h

# DHCPv6 range with minimum prefix length:
#dhcp-range=2001:db8::,2001:db8::,64,24h

# Static DHCP range:
#dhcp-range=192.168.1.0,static

# DHCPv6 with ra-only:
#dhcp-range=2001:db8::,ra-only

# DHCPv6 with ra-names:
#dhcp-range=2001:db8::,ra-names

# DHCPv6 with ra-stateless:
#dhcp-range=2001:db8::,ra-stateless

# DHCPv6 with slaac:
#dhcp-range=2001:db8::1,2001:db8::ffff,slaac


# ============================================================================
# SECTION 7: Domain Name Edge Cases
# ============================================================================

# Single character domain:
#domain=a

# Maximum label length (63 characters):
#domain=abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0

# Maximum domain length (253 characters with dots):
#domain=abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.abcdefghij.ab

# Domain with hyphens:
#domain=my-domain-name.com

# Domain starting with number (valid in subdomain):
#domain=123.example.com

# Domain with single character labels:
#domain=a.b.c.d.e.f.g

# International domain (IDN):
#domain=xn--bcher-kva.example

# Domain with all numeric TLD:
#domain=example.123

# Fully qualified domain name (trailing dot):
#domain=example.com.


# ============================================================================
# SECTION 8: MAC Address Edge Cases
# ============================================================================

# MAC address all zeros:
#dhcp-host=00:00:00:00:00:00,192.168.1.100

# MAC address all ones:
#dhcp-host=ff:ff:ff:ff:ff:ff,192.168.1.101

# MAC address with lowercase:
#dhcp-host=aa:bb:cc:dd:ee:ff,192.168.1.102

# MAC address with uppercase:
#dhcp-host=AA:BB:CC:DD:EE:FF,192.168.1.103

# MAC address with mixed case:
#dhcp-host=Aa:Bb:Cc:Dd:Ee:Ff,192.168.1.104

# MAC address with dashes instead of colons:
#dhcp-host=00-11-22-33-44-55,192.168.1.105

# Wildcard MAC address (dnsmasq extension):
#dhcp-host=11:22:33:*:*:*,set:vendor1


# ============================================================================
# SECTION 9: Special Characters in Strings
# ============================================================================

# Hostname with underscores:
#dhcp-host=11:22:33:44:55:66,my_host_name,192.168.1.110

# Hostname with maximum length (63 characters):
#dhcp-host=11:22:33:44:55:67,abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0,192.168.1.111

# Path with spaces (if quoted or escaped):
#addn-hosts=/path/with spaces/hosts

# Path with special characters:
#addn-hosts=/path/with-special_chars.123/hosts

# TXT record with special characters:
#txt-record=_service._tcp.example.com,"version=1.0,path=/api/v1"

# TXT record with equals signs:
#txt-record=example.com,"key=value=test"

# TXT record with quotes (escaped):
#txt-record=example.com,"text with \"quotes\" inside"


# ============================================================================
# SECTION 10: Server and Address Specifications
# ============================================================================

# Server with specific port:
#server=8.8.8.8#53

# Server with interface:
#server=8.8.8.8@eth0

# Server with source address and port:
#server=8.8.8.8@192.168.1.1#5353

# Server for specific domain:
#server=/example.com/8.8.8.8

# Server for reverse DNS:
#server=/in-addr.arpa/8.8.8.8

# Server with IPv6:
#server=2001:4860:4860::8888

# Server with IPv6 and port:
#server=[2001:4860:4860::8888]#53

# Address override for domain:
#address=/doubleclick.net/0.0.0.0

# Address with IPv6:
#address=/example.com/2001:db8::1

# Address for subdomain wildcard:
#address=/.ads.example.com/127.0.0.1


# ============================================================================
# SECTION 11: DHCP Options Edge Cases
# ============================================================================

# DHCP option with minimum value (option 0 - pad):
#dhcp-option=0

# DHCP option with maximum standard value (option 255 - end):
#dhcp-option=255

# DHCP option with hex value:
#dhcp-option=option:ntp-server,0a:00:00:01

# DHCP option with multiple values:
#dhcp-option=option:dns-server,192.168.1.1,192.168.1.2,192.168.1.3

# DHCP option with string containing spaces:
#dhcp-option=option:domain-name,"example.com domain.local"

# DHCP option with empty value:
#dhcp-option=option:vendor-class

# Vendor-specific DHCP option:
#dhcp-option=vendor:PXEClient,6,2b


# ============================================================================
# SECTION 12: Tag-Based Configuration
# ============================================================================

# Set tag based on MAC address prefix:
#dhcp-host=11:22:33:*:*:*,set:vendor_a

# Set multiple tags:
#dhcp-host=44:55:66:*:*:*,set:vendor_b,set:location_1

# Tag-based option:
#dhcp-option=tag:vendor_a,option:router,192.168.1.1

# Tag-based range:
#dhcp-range=tag:vendor_a,192.168.1.50,192.168.1.100,12h

# Negative tag (not matching):
#dhcp-option=tag:!vendor_a,option:router,192.168.2.1


