# Edge Case Configuration File for dnsmasq Parser Testing
# This file tests parser robustness with various edge cases, boundary conditions,
# and unusual but valid syntax variations to ensure 100% backward compatibility
# between C and Rust implementations.

# ============================================================================
# SECTION 1: Empty Lines and Whitespace Handling
# ============================================================================

# Multiple empty lines follow:



# Line with only spaces:
    
# Line with only tabs:
		
# Mixed spaces and tabs:
  	  	

# Leading whitespace before option:
    port=5353

# Trailing whitespace after option (spaces):
domain-needed    

# Trailing whitespace after option (tabs):
bogus-priv		

# Leading and trailing whitespace:
   filterwin2k   


