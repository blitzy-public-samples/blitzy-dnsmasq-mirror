# DNS-Only Configuration for dnsmasq Testing
# This configuration file is designed to test the DNS subsystem in isolation
# without DHCP or TFTP functionality enabled.
#
# Tests DNS protocol parsing (rfc1035.c), caching (cache.c), and forwarding (forward.c)

# ============================================================================
# DHCP AND TFTP DISABLE - Required for DNS-only mode
# ============================================================================

# Explicitly disable DHCP on all interfaces
# This ensures no DHCP server functionality is active
no-dhcp-interface=*

# Disable TFTP service completely
# (TFTP is disabled by default when not configured, but explicit for clarity)

# ============================================================================
# DNS PORT CONFIGURATION
# ============================================================================

# Listen on standard DNS port 53
# This is the default, but explicit for test clarity
port=53

# ============================================================================
# NETWORK INTERFACE CONFIGURATION
# ============================================================================

# Bind to all interfaces for DNS service
# This allows DNS queries from any network interface
bind-interfaces

# Listen on localhost for testing
listen-address=127.0.0.1
listen-address=::1

# ============================================================================
# DNS QUERY FILTERING
# ============================================================================

# Never forward plain names (without a dot or domain part)
# Prevents queries for single-label names from being forwarded
# Tests domain validation logic in forward.c
domain-needed

# Never forward addresses in the non-routed address spaces
# Filters RFC1918 private address reverse lookups
# Tests bogus query filtering in forward.c
bogus-priv

# Filter useless Windows-originated DNS requests
# Blocks empty SRV requests and other Windows-specific queries
filterwin2k

# ============================================================================
# DNS CACHE CONFIGURATION
# ============================================================================

# Set DNS cache size to 1000 entries
# Tests cache.c implementation with LRU eviction
cache-size=1000

# Enable negative caching (cache NXDOMAIN responses)
# Tests negative response caching in cache.c
# (Enabled by default, opposite would be: no-negcache)

# Set local TTL for /etc/hosts and DHCP-provided names
# Even though DHCP is disabled, tests TTL handling for local names
local-ttl=60

# ============================================================================
# UPSTREAM DNS SERVERS
# ============================================================================

# Don't read upstream servers from /etc/resolv.conf
# Use only the servers specified in this configuration
# Tests static server configuration in forward.c
no-resolv

# Don't poll /etc/resolv.conf for changes
# Ensures consistent test environment
no-poll

# Primary upstream DNS server (Cloudflare)
server=1.1.1.1

# Secondary upstream DNS server (Cloudflare)
server=1.0.0.1

# Google DNS as additional upstream
server=8.8.8.8
server=8.8.4.4

# Domain-specific upstream server
# Route queries for example.local to a specific nameserver
# Tests domain-specific forwarding in forward.c
server=/example.local/192.168.1.1

# IPv6 upstream servers
server=2606:4700:4700::1111
server=2606:4700:4700::1001

# ============================================================================
# LOCAL DOMAIN CONFIGURATION
# ============================================================================

# Set the local domain for name expansion
# Tests domain appending in rfc1035.c
domain=test.local

# Expand simple hostnames by adding local domain
# Converts "myhost" to "myhost.test.local"
expand-hosts

# Define local-only domains (answered from /etc/hosts only)
# Queries for these domains are never forwarded upstream
# Tests local domain resolution in forward.c
local=/test.local/
local=/internal.local/
local=/dev.local/

# ============================================================================
# ADDRESS OVERRIDES
# ============================================================================

# Force specific domains to specific IP addresses
# Tests address override functionality in rfc1035.c and cache.c

# Block ad domains by sending them to localhost
address=/doubleclick.net/127.0.0.1
address=/googlesyndication.com/127.0.0.1

# Override specific test domains to internal addresses
address=/testapp.local/192.168.100.10
address=/api.test.local/192.168.100.20

# IPv6 address override
address=/ipv6test.local/fe80::1

# Wildcard subdomain override
address=/blocked.example/0.0.0.0

# ============================================================================
# DNS PROTOCOL OPTIONS
# ============================================================================

# Set EDNS.0 UDP packet size
# Tests EDNS0 support in edns0.c equivalent (dns/edns.rs)
edns-packet-max=4096

# Enable DNS query logging for testing and debugging
log-queries

# Log DHCP transactions (will be quiet since DHCP is disabled)
# log-dhcp

# Include additional query information in logs
log-facility=/var/log/dnsmasq-test.log

# ============================================================================
# HOSTS FILE CONFIGURATION
# ============================================================================

# Read /etc/hosts for local name resolution
# Tests integration with system hosts file
# (Enabled by default, opposite would be: no-hosts)

# Additional hosts files for testing
# Tests multiple hosts file support
addn-hosts=/etc/dnsmasq.hosts
addn-hosts=/etc/test-hosts

# ============================================================================
# ADVANCED DNS OPTIONS
# ============================================================================

# Limit DNS query rate per IP to prevent abuse
# Tests rate limiting functionality
# cache-rr=SOA

# Strict order for upstream server queries
# Try servers in the order they appear (no parallel queries)
# Tests query ordering in forward.c
strict-order

# Return REFUSED for unknown domains instead of forwarding
# (Commented out for standard forwarding behavior)
# local-service

# Enable domain search suffix
# Allows queries for "hostname" to try "hostname.test.local"
# (Already enabled via expand-hosts)

# Bogus NXDOMAIN filtering
# Treat specific IPs in NXDOMAIN responses as bogus
# Tests NXDOMAIN validation logic
bogus-nxdomain=64.94.110.11

# DNS aliases for address rewriting
# Map one IP range to another in DNS responses
# Tests DNS response modification
alias=192.168.1.0,10.0.0.0,255.255.255.0

# ============================================================================
# DNS RECORD CONFIGURATION
# ============================================================================

# MX record for local domain
# Tests MX record synthesis
mx-host=test.local,mail.test.local,10
mx-target=mail.test.local

# SRV records for service discovery
# Tests SRV record support in rfc1035.c
srv-host=_ldap._tcp.test.local,ldap.test.local,389,0,0
srv-host=_http._tcp.test.local,web.test.local,80,0,0

# PTR records for reverse DNS
# Tests PTR record configuration
ptr-record=1.100.168.192.in-addr.arpa,testhost.test.local

# TXT records for domain information
# Tests TXT record support
txt-record=test.local,"v=spf1 mx -all"
txt-record=_dmarc.test.local,"v=DMARC1; p=reject"

# CNAME records
# Tests CNAME resolution
cname=www.test.local,web.test.local
cname=mail.test.local,smtp.test.local

# ============================================================================
# PERFORMANCE AND RELIABILITY
# ============================================================================

# Maximum number of concurrent DNS queries
# Tests connection limiting
dns-forward-max=150

# Don't cache SERVFAIL responses
# (Default behavior, but explicit for test clarity)
# no-negcache would disable negative caching entirely

# Minimum TTL to cache records regardless of upstream TTL
# Tests TTL override in cache.c
min-cache-ttl=60

# Maximum TTL to cache records (override longer upstream TTLs)
# Tests TTL capping in cache.c
max-ttl=3600

# Set maximum cache TTL for negative (NXDOMAIN) responses
# Tests negative cache TTL handling
neg-ttl=300

# ============================================================================
# SECURITY OPTIONS
# ============================================================================

# Drop root privileges after binding to port 53
# Tests privilege dropping in daemon.rs
user=nobody
group=nogroup

# Enable query source port randomization for security
# Tests random source port allocation
# (Enabled by default in modern dnsmasq)

# DNS loop detection
# Prevent infinite forwarding loops
# Tests loop detection logic in loop.c equivalent (dns/loop_detect.rs)
# (Enabled by default)

# ============================================================================
# DNSSEC CONFIGURATION (if compiled with DNSSEC support)
# ============================================================================

# Enable DNSSEC validation
# Tests DNSSEC validation in dnssec/validation.rs
# Uncomment if DNSSEC feature is enabled
# dnssec
# dnssec-check-unsigned
# conf-file=/usr/share/dnsmasq/trust-anchors.conf

# ============================================================================
# TEST-SPECIFIC OPTIONS
# ============================================================================

# Keep in foreground for test harness
# (Commented - let test harness control this)
# no-daemon

# Don't read /etc/resolv.conf (redundant with no-resolv, but reinforces)
# no-resolv

# PID file location for test isolation
# pid-file=/tmp/dnsmasq-test.pid

# Test-specific domain overrides
address=/localhost.test/127.0.0.1
address=/localhost6.test/::1

# End of DNS-only configuration
# This configuration comprehensively tests:
# - DNS protocol parsing and serialization (rfc1035.c -> dns/protocol.rs)
# - DNS caching with LRU eviction (cache.c -> dns/cache.rs)
# - DNS query forwarding with multiple upstreams (forward.c -> dns/forward.rs)
# - Local domain resolution and filtering (domain.c -> dns/domain.rs)
# - EDNS0 support (edns0.c -> dns/edns.rs)
# - DNS record types (MX, SRV, PTR, TXT, CNAME)
# - Query filtering and validation
# - Address override and aliasing
# - Performance and security features
