# DHCPv4-Only Test Configuration for dnsmasq
# This configuration disables DNS services and focuses exclusively on DHCP functionality
# Used for integration testing of the DHCP subsystem (dhcp.c, rfc2131.c, lease.c)

# =============================================================================
# DNS CONFIGURATION - DISABLED
# =============================================================================
# Disable DNS server functionality by setting port to 0
# This leaves only DHCP and potentially TFTP services active
port=0

# Prevent reading /etc/resolv.conf since DNS is disabled
no-resolv

# Do not read /etc/hosts file
no-hosts

# =============================================================================
# INTERFACE CONFIGURATION
# =============================================================================
# Listen on all interfaces for DHCP requests
# In production, you would typically specify specific interfaces
# Example: interface=eth0
# For testing, we allow binding to all interfaces

# Bind to interfaces instead of wildcard address
# This is safer for testing environments
bind-interfaces

# =============================================================================
# DOMAIN CONFIGURATION
# =============================================================================
# Set the domain for DHCP clients
# This sets the "domain" DHCP option and allows DHCP hosts to have FQDNs
domain=test.local

# =============================================================================
# DHCP RANGE CONFIGURATION
# =============================================================================
# Define the DHCP address pool for dynamic allocation
# Format: dhcp-range=<start-ip>,<end-ip>,<netmask>,<lease-time>
# This allocates addresses from 192.168.100.50 to 192.168.100.150
# with a 12-hour lease time
dhcp-range=192.168.100.50,192.168.100.150,255.255.255.0,12h

# Alternative range with tag for testing tagged options
# This range is used when testing conditional DHCP option delivery
dhcp-range=set:vlan200,192.168.200.50,192.168.200.150,255.255.255.0,24h

# =============================================================================
# STATIC DHCP HOST ASSIGNMENTS
# =============================================================================
# Static IP assignments based on MAC address
# Format: dhcp-host=<mac-address>,<hostname>,<ip-address>,<lease-time>

# Test workstation with permanent lease
dhcp-host=00:11:22:33:44:55,testhost1,192.168.100.10,infinite

# Test server with 24-hour lease
dhcp-host=00:11:22:33:44:66,testhost2,192.168.100.11,24h

# Test device with hostname and IP
dhcp-host=00:11:22:33:44:77,testhost3,192.168.100.12

# Test device with multiple MAC addresses (wired and wireless)
# Dnsmasq will assign the same IP to either MAC address
dhcp-host=00:11:22:33:44:88,aa:bb:cc:dd:ee:ff,testhost4,192.168.100.13

# Test device identified by client ID instead of MAC
dhcp-host=id:01:02:03:04:05:06,testhost5,192.168.100.14

# Test device with client ID string
dhcp-host=id:testclient,testhost6,192.168.100.15

# Ignore DHCP requests from this MAC address
dhcp-host=00:11:22:33:44:99,ignore

# Set tag for specific host to test conditional options
dhcp-host=00:11:22:33:44:aa,set:special,testhost7,192.168.100.16

# Static assignment on VLAN 200 range
dhcp-host=00:11:22:33:55:00,vlanhost1,192.168.200.10,48h

# =============================================================================
# DHCP OPTIONS - NETWORK CONFIGURATION
# =============================================================================
# Send standard DHCP options to configure client network settings
# See RFC 2132 for complete list of DHCP options

# Option 3: Router/Default Gateway
# Set the default gateway to the dnsmasq server's IP
dhcp-option=option:router,192.168.100.1

# Option 6: DNS Servers
# Provide DNS server addresses (even though local DNS is disabled)
# Clients will use these external DNS servers
dhcp-option=option:dns-server,8.8.8.8,8.8.4.4

# Option 15: Domain Name
# This is typically set by the domain= directive, but can be overridden
dhcp-option=option:domain-name,test.local

# Option 42: NTP Servers
# Provide Network Time Protocol servers for time synchronization
dhcp-option=option:ntp-server,192.168.100.1,time.nist.gov

# Option 1: Subnet Mask (automatically provided by dnsmasq based on dhcp-range)
# Explicitly setting it for documentation purposes
dhcp-option=option:netmask,255.255.255.0

# Option 28: Broadcast Address (automatically calculated by dnsmasq)
# dhcp-option=option:broadcast,192.168.100.255

# Option 51: IP Address Lease Time (set in dhcp-range, but can be overridden)
# dhcp-option=option:lease-time,43200

# Option 58: Renewal Time (T1) - defaults to 50% of lease time
dhcp-option=option:T1,21600

# Option 59: Rebinding Time (T2) - defaults to 87.5% of lease time
dhcp-option=option:T2,37800

# =============================================================================
# ADDITIONAL DHCP OPTIONS FOR TESTING
# =============================================================================
# Option 26: MTU
dhcp-option=option:mtu,1500

# Option 119: Domain Search List (RFC 3397)
dhcp-option=option:domain-search,test.local,example.com

# Tagged option: Only sent to hosts with "special" tag
dhcp-option=tag:special,option:ntp-server,192.168.100.100

# VLAN-specific options
dhcp-option=tag:vlan200,option:router,192.168.200.1
dhcp-option=tag:vlan200,option:dns-server,192.168.200.1

# =============================================================================
# VENDOR-SPECIFIC OPTIONS
# =============================================================================
# Windows/Samba-specific options for better Windows client support

# Option 44: NetBIOS over TCP/IP Name Server (WINS)
dhcp-option=44,0.0.0.0

# Option 45: NetBIOS Datagram Distribution Server
dhcp-option=45,0.0.0.0

# Option 46: NetBIOS Node Type (8 = H-node: hybrid)
dhcp-option=46,8

# Option 47: NetBIOS Scope
# dhcp-option=47,

# =============================================================================
# LEASE DATABASE CONFIGURATION
# =============================================================================
# Specify the location of the DHCP lease database file
# This file stores active leases and must be writable
# Format is compatible with ISC dhcpd lease file format
dhcp-leasefile=/tmp/dnsmasq-test.leases

# Set maximum number of DHCP leases
# Prevents memory exhaustion in long-running tests
dhcp-lease-max=200

# =============================================================================
# DHCP SERVER BEHAVIOR
# =============================================================================
# Enable authoritative mode
# In this mode, dnsmasq will immediately respond to DHCP requests
# and take over leases from other DHCP servers
# WARNING: Only enable in isolated test environments
dhcp-authoritative

# Enable DHCPv4 Rapid Commit (RFC 4039)
# Reduces DHCP transaction from 4 messages to 2
# Only safe when this is the only DHCP server on the network
dhcp-rapid-commit

# Read /etc/ethers file for additional MAC-to-IP mappings
# Useful for testing static assignments from external sources
# read-ethers

# =============================================================================
# DHCP SCRIPT EXECUTION
# =============================================================================
# Execute script on lease creation/destruction for testing
# Arguments: "add" or "del", MAC address, IP address, hostname
# Uncomment for testing DHCP script integration (helper.c)
# dhcp-script=/usr/local/bin/dhcp-event.sh

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Enable detailed DHCP transaction logging
# Logs all DHCP packets (DISCOVER, OFFER, REQUEST, ACK, etc.)
# Essential for debugging and integration testing
log-dhcp

# Enable logging to specific file instead of syslog (for testing)
# log-facility=/var/log/dnsmasq-dhcp-test.log

# Enable logging of DHCP lease allocations
# This includes information about why leases were granted or denied
# log-queries

# =============================================================================
# SECURITY AND CLIENT FILTERING
# =============================================================================
# Ignore unknown clients (only serve known dhcp-host entries)
# Equivalent to ISC dhcpd "deny unknown-clients"
# Uncomment for testing restrictive DHCP policies
# dhcp-ignore=tag:!known

# Ignore DHCP name claims for "wpad" (security vulnerability VU#598349)
dhcp-name-match=set:wpad-ignore,wpad
dhcp-ignore-names=tag:wpad-ignore

# =============================================================================
# DHCP RELAY AGENT SUPPORT
# =============================================================================
# For testing DHCP relay agent scenarios (giaddr handling)
# Uncomment to test DHCP relay functionality
# dhcp-relay=192.168.100.1,192.168.200.1

# =============================================================================
# CLIENT IDENTIFICATION
# =============================================================================
# Match clients based on vendor class
# Useful for testing vendor-specific option delivery
dhcp-vendorclass=set:windows,MSFT
dhcp-vendorclass=set:linux,Linux

# Match clients based on user class
dhcp-userclass=set:accounting,accounting
dhcp-userclass=set:engineering,engineering

# Send vendor-specific options based on tags
# Microsoft-specific option to release DHCP lease on shutdown
dhcp-option=vendor:MSFT,2,1i

# =============================================================================
# PXE BOOT SUPPORT (Optional for DHCP testing)
# =============================================================================
# While this is primarily DHCP-focused, PXE options are delivered via DHCP
# Uncomment for testing network boot scenarios

# Set boot filename for PXE clients
# dhcp-boot=pxelinux.0

# Match PXE client architecture for UEFI vs BIOS boot
# dhcp-match=set:efi-x86_64,option:client-arch,7
# dhcp-match=set:bios,option:client-arch,0

# Architecture-specific boot files
# dhcp-boot=tag:efi-x86_64,bootx64.efi
# dhcp-boot=tag:bios,pxelinux.0

# =============================================================================
# TESTING AND DEVELOPMENT OPTIONS
# =============================================================================
# Stop DNS and TFTP completely (redundant with port=0, but explicit)
# no-daemon can be useful for foreground testing

# Run in foreground for testing (don't daemonize)
# no-daemon

# Increase log level for verbose debugging
# log-debug

# Don't check for multiple DHCP servers
# This suppresses warnings in test environments
# no-ping

# =============================================================================
# DHCP CLIENT BEHAVIOR TESTING
# =============================================================================
# Test various lease scenarios

# Short lease time range for rapid turnover testing
# dhcp-range=192.168.100.200,192.168.100.210,255.255.255.0,5m

# Static range (no dynamic allocation, only dhcp-host entries work)
# Useful for testing static-only DHCP configuration
# dhcp-range=192.168.100.0,static,255.255.255.0

# =============================================================================
# COMPATIBILITY AND INTEROPERABILITY
# =============================================================================
# Ensure compatibility with ISC dhcpd lease file format
# This is the default behavior and maintained for testing migration scenarios

# Support for broken DHCP clients that don't handle broadcast correctly
# dhcp-broadcast=tag:needs-broadcast

# Ignore client ID (use MAC address only)
# Some clients send different client IDs between boots
# dhcp-host=00:11:22:33:44:bb,id:*,testhost8,192.168.100.17

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
# This configuration provides comprehensive DHCPv4 testing coverage for:
# - Dynamic address allocation (dhcp-range)
# - Static assignments (dhcp-host with various formats)
# - DHCP options delivery (standard and vendor-specific)
# - Lease persistence (dhcp-leasefile)
# - Authoritative mode operation
# - Client filtering and tagging
# - Logging and debugging
#
# Tests the following C source files:
# - src/dhcp.c (DHCPv4 server core logic)
# - src/rfc2131.c (RFC 2131 DHCPv4 protocol implementation)
# - src/lease.c (Lease database management)
# - src/dhcp-common.c (Common DHCP utilities)
# - src/outpacket.c (DHCP packet construction)
# - src/option.c (Configuration parsing)
#
# Rust module mapping:
# - src/dhcp/v4/server.rs
# - src/dhcp/v4/protocol.rs
# - src/dhcp/v4/state_machine.rs
# - src/dhcp/v4/options.rs
# - src/dhcp/lease.rs
# - src/dhcp/lease_store.rs
# - src/config/parser.rs
