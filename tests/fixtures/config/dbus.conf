# D-Bus Integration Test Configuration
# This configuration file tests D-Bus interface functionality for NetworkManager
# integration and dynamic configuration updates.
#
# Tests the following D-Bus methods from src/integration/dbus.rs:
# - GetVersion: Query dnsmasq version via D-Bus
# - SetServers: Dynamically configure upstream DNS servers
# - SetServersEx: Extended server configuration with domain binding
# - ClearCache: Flush DNS cache via D-Bus signal
#
# Validates dbus.c implementation (Section 0.4.1) translated to Rust using zbus crate

# ============================================================================
# D-Bus Interface Configuration
# ============================================================================

# Enable D-Bus control interface with explicit service name
# Service name: uk.org.thekelleys.dnsmasq (matches D-Bus policy in dbus/dnsmasq.conf)
# This enables NetworkManager integration and dynamic configuration via D-Bus API
enable-dbus=uk.org.thekelleys.dnsmasq

# Disable reading /etc/resolv.conf - upstream servers will be provided via D-Bus
# This is the typical configuration for NetworkManager integration where
# NetworkManager sends upstream DNS servers via D-Bus SetServers method
no-resolv

# Disable polling /etc/resolv.conf for changes (not needed with D-Bus)
no-poll

# ============================================================================
# DNS Configuration for D-Bus Testing
# ============================================================================

# Set DNS port for testing (standard port 53)
port=53

# Enable DNS query logging to verify D-Bus cache operations
log-queries

# Set cache size for testing ClearCache D-Bus method
cache-size=150

# Enable negative caching to test cache clearing functionality
# (ClearCache should clear both positive and negative cache entries)

# Domain configuration for testing SetServersEx domain-specific servers
# Local domain that will be resolved using dynamically configured servers
domain=test.local

# Expand simple names to fully qualified domain names
expand-hosts

# Add local-only domain for testing authoritative responses
local=/localdomain/

# ============================================================================
# DHCP Configuration for D-Bus Lease Notifications
# ============================================================================

# Enable DHCPv4 for testing DHCP lease D-Bus signals
# D-Bus signals are emitted on lease creation, renewal, and expiration
dhcp-range=192.168.100.50,192.168.100.150,12h

# DHCP lease file for persistence testing
dhcp-leasefile=/tmp/dnsmasq-dbus-test.leases

# Enable DHCP lease logging to verify D-Bus notifications
log-dhcp

# DHCP authoritative mode for faster lease assignment in tests
dhcp-authoritative

# Static DHCP host for testing lease change notifications
dhcp-host=00:11:22:33:44:55,192.168.100.100,testhost,12h

# ============================================================================
# DHCPv6 Configuration for D-Bus Testing
# ============================================================================

# Enable DHCPv6 for testing IPv6 lease notifications via D-Bus
dhcp-range=::100,::200,constructor:eth0,ra-names,12h

# Enable Router Advertisement for IPv6 testing
enable-ra

# ============================================================================
# Interface Configuration
# ============================================================================

# Listen on loopback for testing (can be overridden in integration tests)
interface=lo

# Bind to specific interfaces only (security best practice)
bind-interfaces

# ============================================================================
# Logging Configuration for D-Bus Integration Testing
# ============================================================================

# Enable async logging for better performance with D-Bus operations
log-async

# Log facility for testing (can be redirected to file in tests)
# log-facility=/tmp/dnsmasq-dbus-test.log

# ============================================================================
# Security Configuration
# ============================================================================

# Drop privileges after binding to privileged ports
# (D-Bus operations continue to work after privilege drop)
user=nobody
group=nogroup

# Disable reading /etc/hosts to simplify testing
no-hosts

# ============================================================================
# D-Bus Testing Scenarios Enabled by This Configuration
# ============================================================================
#
# 1. Dynamic Server Configuration (SetServers):
#    - Start dnsmasq with no-resolv
#    - Use D-Bus SetServers to configure upstream servers dynamically
#    - Verify DNS queries are forwarded to dynamically configured servers
#
# 2. Extended Server Configuration (SetServersEx):
#    - Configure domain-specific upstream servers via D-Bus
#    - Test server selection based on query domain
#    - Verify interface-specific server binding
#
# 3. Cache Management (ClearCache):
#    - Populate DNS cache with queries
#    - Call ClearCache via D-Bus
#    - Verify cache is completely flushed
#    - Confirm cache statistics reset
#
# 4. Version Query (GetVersion):
#    - Query dnsmasq version via D-Bus GetVersion method
#    - Verify version string matches build version
#
# 5. DHCP Lease Notifications:
#    - Monitor D-Bus for lease creation signals
#    - Monitor D-Bus for lease renewal signals  
#    - Monitor D-Bus for lease expiration signals
#    - Verify signal payloads contain correct lease information
#
# 6. NetworkManager Integration:
#    - Simulate NetworkManager connection changes
#    - Receive upstream server updates via D-Bus
#    - Verify seamless DNS resolution during server changes
#    - Test fallback behavior when servers are removed
#
# 7. Configuration Reload (SIGHUP with D-Bus):
#    - Send SIGHUP to reload configuration
#    - Verify D-Bus interface remains active after reload
#    - Confirm D-Bus service name unchanged
#    - Test that D-Bus clients can reconnect
#
# 8. Multi-Client D-Bus Access:
#    - Multiple D-Bus clients connect simultaneously
#    - Concurrent SetServers calls
#    - Concurrent ClearCache calls
#    - Verify thread-safe D-Bus message handling
#
# ============================================================================
# Expected D-Bus Interface (from dbus.c / integration/dbus.rs)
# ============================================================================
#
# D-Bus Service: uk.org.thekelleys.dnsmasq
# D-Bus Object Path: /uk/org/thekelleys/dnsmasq
# D-Bus Interface: uk.org.thekelleys.dnsmasq
#
# Methods:
#   - GetVersion() -> String
#     Returns: Dnsmasq version string
#
#   - SetServers(Array<String> servers)
#     Parameters: Array of server addresses (e.g., ["8.8.8.8", "1.1.1.1"])
#     Returns: Empty
#     Effect: Replaces current upstream server list
#
#   - SetServersEx(Array<Array<String>> servers)
#     Parameters: Array of [server, domain, domain, ...] arrays
#     Example: [["8.8.8.8", "example.com"], ["1.1.1.1"]]
#     Returns: Empty
#     Effect: Configures domain-specific upstream servers
#
#   - ClearCache()
#     Parameters: None
#     Returns: Empty
#     Effect: Flushes entire DNS cache (positive and negative entries)
#
# Signals (Future Enhancement):
#   - DhcpLeaseAdded(String mac, String ip, String hostname)
#   - DhcpLeaseDeleted(String mac, String ip, String hostname)
#
# ============================================================================
# Rust Implementation Notes (integration/dbus.rs using zbus)
# ============================================================================
#
# The Rust implementation uses the zbus crate for D-Bus communication:
# - Async D-Bus interface using Tokio runtime
# - Type-safe method signatures with serde serialization
# - Automatic D-Bus introspection support
# - Thread-safe shared state access for server list updates
# - Error handling with proper D-Bus error responses
# - Signal emission for DHCP lease events
#
# Configuration compatibility:
# - enable-dbus option preserved exactly as C version
# - Optional service name parameter supported
# - D-Bus policy file format unchanged (dbus/dnsmasq.conf)
# - Method signatures match C implementation byte-for-byte
# - Backward compatible with existing D-Bus clients (NetworkManager, etc.)
#
# ============================================================================
