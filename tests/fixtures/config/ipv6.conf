# IPv6 Test Configuration for dnsmasq-rs
# Tests Router Advertisement (RA), SLAAC, DHCPv6, and related IPv6 features
#
# This configuration file validates the Rust implementation of:
# - src/dhcp/ipv6/radv.rs (Router Advertisement from radv.c)
# - src/dhcp/ipv6/slaac.rs (SLAAC implementation from slaac.c)
# - src/dhcp/v6/ modules (DHCPv6 server functionality)
#
# Per Section 0.7.6: Maintains 100% backward compatibility with dnsmasq.conf format

# Disable DNS to focus on IPv6 DHCP/RA testing
port=0

# Enable DHCPv6 functionality
dhcp-authoritative

# Log all DHCP transactions for test validation
log-dhcp

# Domain for DHCP clients
domain=ipv6test.local

#############################################################################
# Test 1: Router Advertisement Only (ra-only)
# Tests: radv.c implementation - RA without DHCPv6
# Per Section 0.4.1: "dhcp-range with ra-only for Router Advertisement without DHCPv6"
#############################################################################

# Do Router Advertisements, BUT NOT DHCP for this subnet
# Clients will use SLAAC for address autoconfiguration
# Subnet: fd00:1:2:3::/64
# Lifetime: 48 hours (note: minimum lifetime is 2 hours)
dhcp-range=fd00:1:2:3::, ra-only, 48h

#############################################################################
# Test 2: Router Advertisement with DNS Names from DHCPv4 (ra-names)
# Tests: Integration between DHCPv4 leases and IPv6 SLAAC
# Per Section 0.4.1: "dhcp-range with ra-names to derive DNS names from 
# DHCPv4 leases for SLAAC addresses"
#############################################################################

# Derive DNS names for SLAAC addresses from DHCPv4 leases
# This assumes DHCPv4 is running and has lease information
# The IPv6 addresses are derived using SLAAC algorithm based on MAC address
# Subnet: fd00:2:3:4::/64
dhcp-range=fd00:2:3:4::, ra-names

#############################################################################
# Test 3: DHCPv6 with SLAAC (slaac flag)
# Tests: Combined stateful DHCPv6 and SLAAC
# Per Section 0.4.1: "dhcp-range with slaac to enable both DHCPv6 and SLAAC"
#############################################################################

# Do DHCP and Router Advertisements for this subnet
# The 'slaac' keyword sets the A (autonomous) bit in the RA
# This allows clients to use both:
# - SLAAC addresses (self-configured from RA prefix)
# - DHCPv6 addresses (assigned from the specified range)
# Subnet: fd00:3:4:5::/64
# Range: fd00:3:4:5::100 to fd00:3:4:5::200
dhcp-range=fd00:3:4:5::100, fd00:3:4:5::200, slaac, 64

#############################################################################
# Test 4: Stateless DHCPv6 with SLAAC (ra-stateless)
# Tests: DHCPv6 for configuration only, not addresses
# Per Section 0.4.1: "dhcp-range with ra-stateless for stateless DHCPv6 
# with SLAAC addresses"
#############################################################################

# Do Router Advertisements and stateless DHCP for this subnet
# Clients will NOT get addresses from DHCPv6
# They WILL get other configuration (DNS servers, search domains, etc.)
# They WILL use SLAAC for address autoconfiguration
# Subnet: fd00:4:5:6::/64
dhcp-range=fd00:4:5:6::, ra-stateless

#############################################################################
# Test 5: Combined Stateless DHCPv6, SLAAC, and ra-names
# Tests: Full integration of all IPv6 features
# Per Section 0.4.1: Multiple IPv6 features combined
#############################################################################

# Combine stateless DHCP, SLAAC, and DNS name derivation
# - Stateless DHCPv6 provides configuration options
# - SLAAC provides address autoconfiguration
# - ra-names derives DNS names from DHCPv4 leases for SLAAC addresses
# Subnet: fd00:5:6:7::/64
dhcp-range=fd00:5:6:7::, ra-stateless, ra-names

#############################################################################
# Test 6: enable-ra (Global Router Advertisement)
# Tests: Automatic RA for all DHCPv6 subnets
# Per Section 0.4.1: "enable-ra for automatic router advertisements on all 
# DHCPv6 subnets"
#############################################################################

# Enable router advertisements for ALL subnets where we're doing DHCPv6
# Unless overridden by ra-stateless, ra-names, etc:
# - The M (managed) bit will be set (get addresses from DHCPv6)
# - The O (other config) bit will be set (get config from DHCPv6)
# - The A (autonomous) bit will be reset (don't use SLAAC by default)
enable-ra

# Standard DHCPv6 range for testing enable-ra
# Subnet: fd00:6:7:8::/64
# Range: fd00:6:7:8::1000 to fd00:6:7:8::2000
# enable-ra will automatically send RAs for this subnet
dhcp-range=fd00:6:7:8::1000, fd00:6:7:8::2000, 64, 12h

#############################################################################
# Test 7: ra-param (Router Advertisement Parameters)
# Tests: Custom RA intervals, lifetimes, MTU, and priority
# Per Section 0.4.1: "ra-param for router advertisement lifetime and intervals"
#############################################################################

# Set custom RA parameters for interface eth0
# Format: ra-param=<interface>,[mtu:<value>|<interface>|off,][high,|low,]<interval>[,<lifetime>]
# - Interface: eth0
# - MTU: 1280 bytes (minimum IPv6 MTU)
# - Priority: high (for preferred router)
# - Interval: 600 seconds (10 minutes) between RAs
# - Lifetime: 1800 seconds (30 minutes) route lifetime
ra-param=eth0,mtu:1280,high,600,1800

# Set RA parameters for interface eth1 with different values
# - Interface: eth1
# - Priority: low (for backup router)
# - Interval: 300 seconds (5 minutes)
# - Lifetime: 900 seconds (15 minutes)
ra-param=eth1,low,300,900

# Set RA parameters for interface eth2 with MTU from another interface
# - Interface: eth2
# - MTU: Use MTU from eth0 (useful for WAN MTU propagation)
# - Interval: 200 seconds
# - Lifetime: 600 seconds
ra-param=eth2,mtu:eth0,200,600

# Set RA parameters to advertise prefixes but not a route (lifetime 0)
# - Interface: eth3
# - Interval: 100 seconds
# - Lifetime: 0 (no default route via this router, but prefixes advertised)
ra-param=eth3,100,0

#############################################################################
# Test 8: DHCPv6 Options for IPv6 Configuration
# Tests: DHCPv6 option passing
#############################################################################

# Send DHCPv6 DNS server options
# Clients will use these DNS servers for name resolution
dhcp-option=option6:dns-server,[fd00:53::1],[fd00:53::2]

# Send DHCPv6 domain search list
dhcp-option=option6:domain-search,ipv6test.local,test.local

# Send information refresh time (RFC 4242)
# Clients will poll for option changes every 6 hours
dhcp-option=option6:information-refresh-time,6h

# Send NTP server via DHCPv6
dhcp-option=option6:ntp-server,[fd00:123::1]

# Send SIP server via DHCPv6
dhcp-option=option6:sip-server,[fd00:5060::1]

#############################################################################
# Test 9: DHCPv6 Static Host Configuration
# Tests: Fixed IPv6 address assignment via DUID
#############################################################################

# Assign fixed IPv6 address to client with specific DUID
# DUID: 00:01:00:01:16:d2:83:fc:92:d4:19:e2:d8:b2
# Note: MAC addresses CANNOT be used to identify DHCPv6 clients
# Note: [] around IPv6 address are obligatory
dhcp-host=id:00:01:00:01:16:d2:83:fc:92:d4:19:e2:d8:b2,ipv6-client-1,[fd00:6:7:8::42]

# Another fixed address with hostname
dhcp-host=id:00:01:00:01:20:a1:b2:c3:d4:e5:f6:07:08:09,ipv6-client-2,[fd00:6:7:8::100]

#############################################################################
# Test 10: Multiple IPv6 Prefixes and Subnets
# Tests: Multi-subnet IPv6 deployment scenario
#############################################################################

# Production subnet with standard DHCPv6
dhcp-range=2001:db8:1000::100,2001:db8:1000::500,64,24h

# Guest network with RA-only (no DHCPv6 addresses)
dhcp-range=2001:db8:2000::,ra-only,1h

# IoT network with stateless DHCPv6 and SLAAC
dhcp-range=2001:db8:3000::,ra-stateless,slaac

# Management network with full DHCPv6 and SLAAC support
dhcp-range=2001:db8:4000::10,2001:db8:4000::50,slaac,64,48h

#############################################################################
# Test 11: Quiet Mode for Testing
# Tests: Logging control for specific protocols
#############################################################################

# Uncomment to suppress DHCPv6 logging (useful for high-traffic testing)
#quiet-dhcp6

# Uncomment to suppress RA logging (useful for high-frequency RA testing)
#quiet-ra

#############################################################################
# End of IPv6 Test Configuration
#############################################################################
