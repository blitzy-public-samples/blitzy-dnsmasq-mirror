# Minimal dnsmasq configuration for DNS forwarding testing
# This configuration contains only the bare essentials required for basic DNS forwarding
# operation. Used to test that the Rust parser correctly applies default values from
# config.h constants matching the C implementation.
#
# This minimal configuration validates:
# - Basic configuration file parsing (INI-style format)
# - Listen address specification
# - Upstream DNS server configuration
# - Domain setting
# - Default value application for all unspecified options
#
# Expected behavior: dnsmasq should start successfully with only these options,
# applying all default values for unspecified parameters (cache size, port number,
# lease handling, etc.)

# Listen on localhost only for testing
# This restricts DNS service to local machine, preventing external exposure during tests
listen-address=127.0.0.1

# Upstream DNS server for query forwarding
# All DNS queries will be forwarded to this server
server=8.8.8.8

# Optional domain setting for local network resolution
# Sets the domain for DHCP hosts and expand-hosts functionality
domain=test.local
