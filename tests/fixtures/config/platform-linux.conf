# Linux-specific platform features configuration for testing
# Tests Linux platform modules: netlink.rs, ipset.rs, nftset.rs, conntrack.rs, inotify.rs
# 
# This configuration validates that the Rust implementation correctly handles
# Linux-specific features that were implemented in the C version via:
# - netlink.c (Linux netlink socket interface)
# - ipset.c (Linux ipset integration)
# - nftset.c (nftables set manipulation)
# - conntrack.c (Linux connection tracking integration)
# - inotify.c (File monitoring for /etc/hosts and /etc/resolv.conf)
#
# Maintains 100% backward compatibility with dnsmasq.conf format per Section 0.7.6

# ============================================================================
# NETLINK-BASED INTERFACE MONITORING
# ============================================================================

# bind-dynamic: Use Linux netlink to dynamically bind to interfaces
# This tests platform/linux/netlink.rs functionality for automatic interface
# discovery and binding. On Linux, this uses netlink sockets to monitor
# interface changes and automatically bind to new interfaces.
bind-dynamic

# Interface specifications that will be resolved via netlink
# Tests netlink-based interface enumeration
interface=eth0
interface=eth1
interface=wlan0

# Exclude interfaces using netlink discovery
# Tests no-dhcp-interface with netlink interface monitoring
except-interface=docker0
except-interface=virbr0

# Disable DHCP on specific interfaces while keeping DNS
# Tests selective service disabling with netlink interface tracking
no-dhcp-interface=lo
no-dhcp-interface=tun*

# Listen on specific addresses (netlink will monitor these)
listen-address=127.0.0.1
listen-address=::1

# ============================================================================
# IPSET INTEGRATION (Linux-specific)
# ============================================================================

# ipset: Add DNS query results to Linux ipset
# Tests platform/linux/ipset.rs functionality
# Syntax: ipset=/<domain>/<ipset-name>[,<ipset-name>]
# 
# This tests the translation from C's ipset.c to Rust's platform/linux/ipset.rs
# All addresses returned for queries in these domains will be added to the
# specified ipset(s) via netlink communication with the kernel's ipset subsystem.

# Add all addresses from example.com to the 'blocked' ipset
ipset=/example.com/blocked

# Add addresses from multiple domains to multiple ipsets
ipset=/malware.example.net/blocked,suspicious

# Add tracking domains to monitoring ipset
ipset=/tracker.example.org/tracking

# Add ad-serving domains to blocking ipset
ipset=/ads.example.com/adblock

# Wildcard domain matching with ipset
ipset=/evil.example.net/blacklist

# Multiple domains to same ipset (tests batch operations)
ipset=/spam1.example.org/spam2.example.org/spam3.example.org/spamlist

# ============================================================================
# NFTABLES SET INTEGRATION (Linux-specific)
# ============================================================================

# nftset: Add DNS query results to Linux nftables sets
# Tests platform/linux/nftset.rs functionality
# Syntax: nftset=/<domain>/[4|6]#<family>#<table>#<set>[,<set>]
#
# This tests the translation from C's nftset.c to Rust's platform/linux/nftset.rs
# Integrates with nftables (successor to iptables) via netlink protocol.
# Format: [4|6]#<address-family>#<table-name>#<set-name>
#   4 = IPv4 only, 6 = IPv6 only, omit for both

# Add addresses to nftables sets (both IPv4 and IPv6)
nftset=/example.com/ip#filter#blocked

# IPv4-only nftables set
nftset=/ipv4only.example.net/4#ip#filter#blocked_ipv4

# IPv6-only nftables set
nftset=/ipv6only.example.net/6#ip6#filter#blocked_ipv6

# Multiple sets for the same domain
nftset=/multi.example.org/ip#filter#set1,ip#filter#set2

# Different tables and families
nftset=/nat.example.com/4#ip#nat#natset
nftset=/forward.example.net/4#ip#forward#fwdset

# Combined IPv4 and IPv6 sets for dual-stack testing
nftset=/dualstack.example.org/4#ip#filter#dual4
nftset=/dualstack.example.org/6#ip6#filter#dual6

# Test with custom table names
nftset=/custom.example.com/ip#customtable#customset

# Wildcard domains with nftset
nftset=/wildcard.example.net/ip#filter#wildcardset

# ============================================================================
# CONNECTION TRACKING INTEGRATION (Linux-specific)
# ============================================================================

# conntrack: Enable Linux connection tracking mark setting
# Tests platform/linux/conntrack.rs functionality
#
# This tests the translation from C's conntrack.c to Rust's 
# platform/linux/conntrack.rs. Enables reading connection tracking
# information from the Linux kernel's netfilter conntrack subsystem
# via netlink protocol (NFNETLINK).
#
# When enabled, dnsmasq can read connection tracking marks and use
# them to influence DHCP lease allocation and DNS response routing.

# Note: The 'conntrack' option is a boolean flag that enables the feature
# In actual dnsmasq, this would be: --enable-conntrack or conntrack
# For testing, we document it but may not use it directly in config file
# as it's typically a compile-time and command-line option

# ============================================================================
# INOTIFY FILE WATCHING (Linux-specific)
# ============================================================================

# Inotify is used automatically by dnsmasq on Linux for monitoring:
# - /etc/hosts for changes
# - /etc/resolv.conf for changes  
# - Additional hosts files specified via addn-hosts
# - Configuration directories specified via conf-dir
#
# Tests platform/linux/inotify.rs functionality which replaces inotify.c
# This is automatic on Linux and doesn't require explicit configuration,
# but we include related options to ensure the inotify integration works.

# Additional hosts files to monitor via inotify
addn-hosts=/etc/dnsmasq.d/hosts
addn-hosts=/var/lib/dnsmasq/hosts.local

# Configuration directories to monitor via inotify
conf-dir=/etc/dnsmasq.d/,*.conf

# Standard /etc/hosts monitoring (automatic with inotify on Linux)
# The no-hosts option would disable this, so we leave it enabled
# no-hosts  # commented out to enable /etc/hosts monitoring

# Standard /etc/resolv.conf monitoring (automatic with inotify on Linux)
resolv-file=/etc/resolv.conf
# The no-poll option would disable inotify monitoring
# no-poll  # commented out to enable inotify-based monitoring

# ============================================================================
# AUTHORITATIVE DNS WITH NETLINK (Linux-specific)
# ============================================================================

# auth-zone: Authoritative DNS zone with netlink interface enumeration
# Tests integration of DNS auth module with Linux netlink for interface discovery
# 
# On Linux, auth-zone can use netlink to automatically discover interface
# addresses and subnet information, which is then used for authoritative
# DNS responses.

# Authoritative zone using netlink for interface/subnet discovery
auth-zone=example.local,eth0
auth-zone=test.local,eth1

# Authoritative zone with explicit subnet (still uses netlink for interface info)
auth-zone=internal.local,192.168.1.0/24,eth0

# Authoritative server declaration
auth-server=ns1.example.local,eth0
auth-server=ns2.example.local,eth1

# ============================================================================
# DHCP CONFIGURATION WITH LINUX FEATURES
# ============================================================================

# DHCP range for testing with Linux features
dhcp-range=192.168.1.50,192.168.1.150,12h

# DHCPv6 range for testing with Linux netlink IPv6 discovery
dhcp-range=fd00::100,fd00::200,64,12h

# DHCP lease file location (standard Linux location)
dhcp-leasefile=/var/lib/misc/dnsmasq-test.leases

# Enable DHCP authoritative mode for testing
dhcp-authoritative

# ============================================================================
# DNS CONFIGURATION
# ============================================================================

# DNS port
port=5353

# Upstream DNS servers
server=8.8.8.8
server=8.8.4.4
server=2001:4860:4860::8888
server=2001:4860:4860::8844

# DNS cache size
cache-size=1000

# Local domain
domain=test.local

# Expand hostnames to FQDN
expand-hosts

# ============================================================================
# LOGGING (for testing validation)
# ============================================================================

# Enable query logging to verify Linux-specific features
log-queries

# Enable DHCP logging
log-dhcp

# Log to specific facility
log-facility=/var/log/dnsmasq-test.log

# ============================================================================
# ADDITIONAL LINUX-SPECIFIC TESTING OPTIONS
# ============================================================================

# Enable DNSSEC (uses Linux-specific crypto if available)
# dnssec  # Commented: requires DNSSEC build flag

# Enable TFTP (uses Linux-specific network features)
# enable-tftp  # Commented: not needed for platform testing
# tftp-root=/var/lib/tftpboot

# DBus integration (Linux-specific IPC)
# enable-dbus  # Commented: requires DBus build flag

# Script execution (uses Linux process management)
# dhcp-script=/usr/local/bin/dhcp-event-handler.sh

# ============================================================================
# INTERFACE-SPECIFIC OPTIONS (Netlink-based)
# ============================================================================

# Serve DHCP only on specific interfaces (uses netlink for interface resolution)
# The interface names are resolved via netlink
dhcp-range=eth0,192.168.1.50,192.168.1.150,12h

# Different range for different interface
dhcp-range=eth1,192.168.2.50,192.168.2.150,12h

# Router advertisement for IPv6 (uses netlink for interface discovery)
dhcp-range=eth0,::,ra-stateless

# Enable router advertisements globally (uses netlink for all interfaces)
enable-ra

# ============================================================================
# NOTES FOR TEST VALIDATION
# ============================================================================
#
# This configuration file tests the following Linux-specific Rust modules:
#
# 1. platform/linux/netlink.rs - Tests:
#    - bind-dynamic interface binding
#    - Interface enumeration and monitoring
#    - Interface-specific DHCP ranges
#    - Authoritative DNS with interface discovery
#
# 2. platform/linux/ipset.rs - Tests:
#    - ipset=/<domain>/<setname> syntax
#    - Multiple domains to multiple sets
#    - Netlink communication with kernel ipset subsystem
#
# 3. platform/linux/nftset.rs - Tests:
#    - nftset=/<domain>/[4|6]#<family>#<table>#<set> syntax  
#    - IPv4-only (4#) and IPv6-only (6#) variants
#    - Different address families (ip, ip6)
#    - Multiple tables and sets
#
# 4. platform/linux/conntrack.rs - Tests:
#    - Connection tracking integration
#    - Netfilter netlink protocol (NFNETLINK)
#
# 5. platform/linux/inotify.rs - Tests:
#    - /etc/hosts monitoring
#    - /etc/resolv.conf monitoring
#    - addn-hosts file monitoring
#    - conf-dir directory monitoring
#
# All features maintain 100% backward compatibility with C version
# as required by Section 0.7.6 of the Agent Action Plan.
#
# The configuration uses identical syntax to the C version's dnsmasq.conf
# format, ensuring drop-in replacement capability.
