# Full-Featured dnsmasq Configuration Test Fixture
# This configuration file comprehensively tests all major subsystems of dnsmasq
# for validation of the Rust parser implementation (config/parser.rs and config/options.rs)
# ensuring 100% backward compatibility with dnsmasq.conf format per Section 0.7.6

# ==============================================================================
# GENERAL CONFIGURATION
# ==============================================================================

# Run as specific user and group for privilege separation
user=dnsmasq
group=dnsmasq

# Prevent reading /etc/resolv.conf for upstream servers
no-resolv

# Prevent polling /etc/resolv.conf for changes
no-poll

# Use strict order for upstream servers
strict-order

# Domain configuration
domain=example.com
expand-hosts

# Domain for specific subnets
domain=wireless.example.com,192.168.2.0/24
domain=wired.example.com,192.168.1.0/24

# ==============================================================================
# DNS FORWARDING AND CACHING
# ==============================================================================

# DNS port (0 disables DNS, leaving only DHCP/TFTP)
port=53

# Cache size for DNS responses
cache-size=10000

# Negative caching
no-negcache

# Local TTL for /etc/hosts and DHCP entries
local-ttl=300

# Maximum TTL for cached entries
max-ttl=3600

# Maximum cache TTL
max-cache-ttl=86400

# Minimum cache TTL
min-cache-ttl=60

# DNS forward max (maximum concurrent queries)
dns-forward-max=1000

# ==============================================================================
# UPSTREAM DNS SERVERS
# ==============================================================================

# Upstream DNS servers with domain-specific routing
server=8.8.8.8
server=8.8.4.4
server=1.1.1.1

# Domain-specific upstream servers
server=/localnet/192.168.0.1
server=/internal.example.com/10.0.0.1

# PTR queries to specific nameserver
server=/3.168.192.in-addr.arpa/10.1.2.3

# Server with interface binding
server=10.1.2.3@eth1

# Server with source address
server=10.1.2.3@192.168.1.1#55

# ==============================================================================
# LOCAL DOMAINS AND ADDRESS OVERRIDES
# ==============================================================================

# Local-only domains (answered from /etc/hosts or DHCP only)
local=/localnet/
local=/test.local/

# Force specific domains to specific IP addresses
address=/doubleclick.net/127.0.0.1
address=/ads.example.com/0.0.0.0
address=/tracker.example.com/::

# IPv6 address override
address=/ipv6.example.com/fe80::20d:60ff:fe36:f83

# Bogus NXDOMAIN filtering (Verisign sitefinder blocking)
bogus-nxdomain=64.94.110.11

# ==============================================================================
# NETWORK INTERFACES AND BINDING
# ==============================================================================

# Listen on specific interfaces
interface=eth0
interface=eth1
interface=wlan0

# Don't listen on specific interfaces
except-interface=eth2

# Listen on specific addresses
listen-address=127.0.0.1
listen-address=192.168.1.1
listen-address=::1

# Bind to interfaces (don't bind wildcard)
bind-interfaces

# Disable DHCP/TFTP on specific interfaces (DNS only)
no-dhcp-interface=eth2

# ==============================================================================
# HOSTS FILE CONFIGURATION
# ==============================================================================

# Don't read /etc/hosts
#no-hosts

# Additional hosts files
addn-hosts=/etc/dnsmasq.hosts
addn-hosts=/var/lib/dnsmasq/hosts

# ==============================================================================
# DNSSEC VALIDATION
# ==============================================================================

# Enable DNSSEC validation
dnssec

# Check unsigned replies
dnssec-check-unsigned

# DNSSEC trust anchor (root zone)
trust-anchor=.,20326,8,2,E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D

# DNSSEC debug mode
#dnssec-debug

# ==============================================================================
# DHCPV4 CONFIGURATION
# ==============================================================================

# DHCPv4 ranges
dhcp-range=192.168.1.50,192.168.1.200,255.255.255.0,12h
dhcp-range=192.168.2.100,192.168.2.250,24h

# DHCPv4 range with tag
dhcp-range=set:office,192.168.10.50,192.168.10.150,8h

# Static range (for static assignments only)
dhcp-range=192.168.3.0,static

# Set authoritative mode
dhcp-authoritative

# DHCPv4 Rapid Commit (RFC 4039)
dhcp-rapid-commit

# Maximum number of DHCP leases
dhcp-lease-max=500

# DHCP lease file location
dhcp-leasefile=/var/lib/dnsmasq/dnsmasq.leases

# ==============================================================================
# DHCPV4 STATIC LEASES
# ==============================================================================

# Static lease by MAC address
dhcp-host=11:22:33:44:55:66,192.168.1.100

# Static lease with hostname
dhcp-host=11:22:33:44:55:67,server1,192.168.1.101

# Static lease with lease time
dhcp-host=11:22:33:44:55:68,server2,192.168.1.102,24h

# Multiple MACs for same IP (laptop with wired/wireless)
dhcp-host=11:22:33:44:55:69,11:22:33:44:55:70,192.168.1.103

# Static lease with infinite lease time
dhcp-host=11:22:33:44:55:71,server3,192.168.1.104,infinite

# Static lease by client ID
dhcp-host=id:01:02:02:04,192.168.1.105

# Ignore specific MAC address
dhcp-host=aa:bb:cc:dd:ee:ff,ignore

# Set tag for specific host
dhcp-host=11:22:33:44:55:72,set:printer

# Read /etc/ethers for additional static mappings
read-ethers

# ==============================================================================
# DHCPV4 OPTIONS
# ==============================================================================

# Router (default gateway) - option 3
dhcp-option=3,192.168.1.1
dhcp-option=option:router,192.168.2.1

# DNS servers - option 6
dhcp-option=option:dns-server,192.168.1.1,8.8.8.8

# NTP servers - option 42
dhcp-option=option:ntp-server,192.168.1.1,pool.ntp.org

# Domain name - option 15
dhcp-option=option:domain-name,example.com

# Domain search list - option 119 (RFC 3397)
dhcp-option=option:domain-search,example.com,corp.example.com

# Classless static routes - option 121 (RFC 3442)
dhcp-option=121,192.168.100.0/24,192.168.1.254,10.0.0.0/8,192.168.1.253

# Client renewal time (T1) - option 58
dhcp-option=option:T1,3600

# Rebinding time (T2) - option 59
dhcp-option=option:T2,6300

# NIS domain - option 40
dhcp-option=40,example-nis

# TTL - option 23
dhcp-option=23,64

# All subnets local - option 27
dhcp-option=27,1

# NetBIOS name servers (WINS) - option 44
dhcp-option=44,192.168.1.10

# NetBIOS node type - option 46
dhcp-option=46,8

# WPAD (Web Proxy Auto-Discovery) - option 252
dhcp-option=252,"\n"

# Tagged options (only for specific tags)
dhcp-option=tag:office,option:ntp-server,192.168.10.1
dhcp-option=tag:printer,option:router,192.168.1.254

# ==============================================================================
# DHCPV4 VENDOR-SPECIFIC OPTIONS
# ==============================================================================

# Vendor class matching
dhcp-vendorclass=set:pxeclient,PXEClient
dhcp-vendorclass=set:msft,MSFT

# User class matching
dhcp-userclass=set:accounting,accounting

# MAC address pattern matching
dhcp-mac=set:cisco,00:60:8C:*:*:*

# Vendor-encapsulated options (option 43)
dhcp-option=vendor:PXEClient,1,0.0.0.0

# Microsoft-specific option (release on shutdown)
dhcp-option=vendor:MSFT,2,1i

# PXELinux-specific options
dhcp-option-force=208,f1:00:74:7e
dhcp-option-force=209,configs/common
dhcp-option-force=210,/tftpboot/pxelinux/files/
dhcp-option-force=211,30i

# ==============================================================================
# PXE NETWORK BOOT CONFIGURATION
# ==============================================================================

# Basic PXE boot file
dhcp-boot=pxelinux.0

# PXE boot with external TFTP server
dhcp-boot=pxelinux.0,bootserver,192.168.1.250

# iPXE configuration
dhcp-match=set:ipxe,175
dhcp-boot=tag:!ipxe,undionly.kpxe
dhcp-boot=tag:ipxe,http://boot.ipxe.org/script.php

# Architecture-specific boot files
dhcp-match=set:x86_bios,option:client-arch,0
dhcp-match=set:x86_64_efi,option:client-arch,7
dhcp-match=set:x86_64_efi,option:client-arch,9
dhcp-match=set:arm64_efi,option:client-arch,11

dhcp-boot=tag:x86_bios,bios/pxelinux.0
dhcp-boot=tag:x86_64_efi,efi64/bootx64.efi
dhcp-boot=tag:arm64_efi,efiarm64/bootaa64.efi

# PXE service menu
pxe-prompt="Press F8 for network boot menu", 5
pxe-service=x86PC,"Boot from local disk",0
pxe-service=x86PC,"Install Linux",pxelinux
pxe-service=x86-64_EFI,"Boot from local disk",0
pxe-service=x86-64_EFI,"Install Linux EFI",efi64/bootx64.efi

# ==============================================================================
# DHCPV6 CONFIGURATION
# ==============================================================================

# DHCPv6 range with 64-bit prefix
dhcp-range=2001:db8:1::100,2001:db8:1::200,64,12h

# DHCPv6 with constructor (use interface prefix)
dhcp-range=::100,::200,constructor:eth0,64,12h

# Router Advertisement only (no DHCPv6 addresses)
dhcp-range=2001:db8:2::,ra-only,24h

# Router Advertisement with SLAAC
dhcp-range=2001:db8:3::,ra-only,slaac

# Router Advertisement with stateless DHCPv6
dhcp-range=2001:db8:4::,ra-stateless,ra-names

# DHCPv6 with SLAAC (stateful + SLAAC)
dhcp-range=2001:db8:5::100,2001:db8:5::200,slaac,ra-names

# Enable Router Advertisement globally
enable-ra

# ==============================================================================
# DHCPV6 STATIC ASSIGNMENTS
# ==============================================================================

# DHCPv6 static assignment by DUID
dhcp-host=id:00:01:00:01:1a:2b:3c:4d:5e:6f:70:71:72:73,client1,[2001:db8:1::50]

# DHCPv6 static with hostname
dhcp-host=id:00:01:00:01:aa:bb:cc:dd:11:22:33:44:55:66,server6,[2001:db8:1::100],24h

# ==============================================================================
# DHCPV6 OPTIONS
# ==============================================================================

# DHCPv6 DNS servers - option 23
dhcp-option=option6:dns-server,[2001:db8:1::1],[2606:4700:4700::1111]

# DHCPv6 domain search list - option 24
dhcp-option=option6:domain-search,example.com,ipv6.example.com

# DHCPv6 NTP servers - option 56
dhcp-option=option6:ntp-server,[2001:db8:1::1]

# DHCPv6 information refresh time - option 32 (RFC 4242)
dhcp-option=option6:information-refresh-time,21600

# ==============================================================================
# ROUTER ADVERTISEMENT (RA) CONFIGURATION
# ==============================================================================

# RA parameters for specific prefix
ra-param=eth0,60,1800

# RA parameters with high/low intervals
ra-param=eth1,30,60,1800

# RA with specific MTU
ra-param=*,mtu:1280

# RA names (generate DNS names from SLAAC addresses)
ra-names

# ==============================================================================
# TFTP SERVER CONFIGURATION
# ==============================================================================

# Enable built-in TFTP server
enable-tftp

# TFTP root directory
tftp-root=/var/lib/tftpboot

# Multiple TFTP roots for different interfaces/IPs
tftp-root=/var/lib/tftpboot/default
tftp-root=/var/lib/tftpboot/office,192.168.10.0/24
tftp-root=/srv/tftp/pxe,eth0

# TFTP secure mode (only serve files owned by dnsmasq user)
tftp-secure

# Don't fail if TFTP root unavailable
tftp-no-fail

# Disable blocksize negotiation
tftp-no-blocksize

# Enable TFTP port range
tftp-port-range=4096,8192

# Lowercase TFTP filenames
tftp-lowercase

# Unique TFTP root per MAC address
tftp-unique-root=mac

# ==============================================================================
# AUTHORITATIVE DNS SERVER
# ==============================================================================

# Authoritative zone
auth-zone=example.com,192.168.1.0/24

# Authoritative zone with IPv6
auth-zone=ipv6.example.com,2001:db8:1::/64

# Secondary authoritative zone
auth-zone=secondary.example.com

# Authoritative server address
auth-server=ns1.example.com,eth0

# Authoritative SOA serial
auth-soa=1,hostmaster.example.com

# Authoritative peer (secondary DNS)
auth-peer=192.168.1.2

# ==============================================================================
# EDNS0 CONFIGURATION
# ==============================================================================

# EDNS packet size
edns-packet-max=4096

# ==============================================================================
# DNS LOOP DETECTION
# ==============================================================================

# Enable DNS loop detection
#dns-loop-detect

# ==============================================================================
# PLATFORM-SPECIFIC FEATURES (LINUX)
# ==============================================================================

# Linux ipset integration
ipset=/google.com/vpn
ipset=/facebook.com/social,filtered

# Linux nftables integration
nftset=/netflix.com/4#ip#dnsmasq#streaming4
nftset=/netflix.com/6#ip6#dnsmasq#streaming6

# Connection tracking mark
conntrack

# ==============================================================================
# EXTERNAL INTEGRATIONS
# ==============================================================================

# D-Bus integration
enable-dbus
enable-dbus=uk.org.thekelleys.dnsmasq

# OpenWrt ubus integration (compile-time option)
#enable-ubus

# DHCP script execution
dhcp-script=/usr/local/bin/dhcp-event.sh

# Lua script for DHCP lease processing
#dhcp-luascript=/etc/dnsmasq/dhcp.lua

# Script user (run scripts as specific user)
script-user=nobody

# ==============================================================================
# LOGGING CONFIGURATION
# ==============================================================================

# Log all DNS queries
log-queries

# Extra logging for DHCP
log-dhcp

# Log asynchronously
log-async

# Log facility
log-facility=/var/log/dnsmasq.log

# Syslog facility
#log-facility=local0

# Quiet DHCP logging
quiet-dhcp
quiet-dhcp6
quiet-ra

# ==============================================================================
# SECURITY AND FILTERING
# ==============================================================================

# Never forward plain names (without dots)
domain-needed

# Never forward private IP reverse lookups
bogus-priv

# Stop DNS rebind attacks
stop-dns-rebind

# Rebind localhost addresses
rebind-localhost-ok

# Rebind domain whitelist
rebind-domain-ok=/example.com/
rebind-domain-ok=/internal.example.local/

# Filter Windows-originated useless queries
filterwin2k

# DHCP name filtering (block WPAD)
dhcp-name-match=set:wpad-ignore,wpad
dhcp-ignore-names=tag:wpad-ignore

# Ignore unknown DHCP clients
#dhcp-ignore=tag:!known

# ==============================================================================
# PERFORMANCE TUNING
# ==============================================================================

# DNS forward max queries
dns-forward-max=1000

# Cache size
cache-size=10000

# Maximum cache entries
max-cache-ttl=86400

# Negative cache TTL
neg-ttl=3600

# Local TTL
local-ttl=60

# ==============================================================================
# DNS RECORD TYPES
# ==============================================================================

# MX records
mx-host=example.com,mail.example.com,10
mx-host=example.com,mail2.example.com,20
mx-target=mail.example.com
localmx

# SRV records for LDAP
srv-host=_ldap._tcp.example.com,ldap.example.com,389,1
srv-host=_ldap._tcp.example.com,ldap2.example.com,389,2

# SRV records for SIP
srv-host=_sip._tcp.example.com,sip.example.com,5060

# SRV records for Kerberos
srv-host=_kerberos._tcp.example.com,kdc.example.com,88

# PTR records for DNS-SD
ptr-record=_services._dns-sd._udp.example.com,"Web Server._http._tcp.example.com"

# TXT records for SPF
txt-record=example.com,"v=spf1 mx a:mail.example.com -all"

# TXT records for DKIM
txt-record=default._domainkey.example.com,"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQ..."

# TXT records for DMARC
txt-record=_dmarc.example.com,"v=DMARC1; p=reject; rua=mailto:dmarc@example.com"

# CNAME records
cname=www.example.com,example.com
cname=ftp.example.com,example.com

# ==============================================================================
# ALIAS CONFIGURATION (DNS RESULT REWRITING)
# ==============================================================================

# Simple alias
alias=1.2.3.4,5.6.7.8

# Subnet alias
alias=192.168.0.0,10.0.0.0,255.255.255.0

# Range alias
alias=192.168.100.10-192.168.100.50,10.0.0.10,255.255.255.0

# ==============================================================================
# ADDITIONAL CONFIGURATION FILES
# ==============================================================================

# Include additional configuration file
conf-file=/etc/dnsmasq.d/custom.conf

# Include directory (all files)
conf-dir=/etc/dnsmasq.d

# Include directory excluding .bak files
conf-dir=/etc/dnsmasq.d,.bak

# Include directory with pattern
conf-dir=/etc/dnsmasq.d/,*.conf

# ==============================================================================
# MISCELLANEOUS OPTIONS
# ==============================================================================

# Don't read /etc/resolv.conf
no-resolv

# All queries answered from local data have TTL
local-service

# Return answers to DNS queries from /etc/hosts with zero TTL
#no-hosts

# Set the "all servers" mode
all-servers

# Expand hostnames in /etc/hosts
expand-hosts

# Enable query ID randomization
query-port=0

# Bind only to interfaces in use
bind-dynamic

# Don't use /etc/hosts for reverse lookups
no-hosts

# Additional hosts directory
hostsdir=/etc/dnsmasq.d/hosts

# Interface name for server directive
server-interface=eth0

# Set DNS min port
min-port=1024

# Set maximum DNS packet size
dns-packet-max=4096

# Broken RTC support (for embedded systems)
#no-daemon

# Keep in foreground
#no-daemon

# PID file location
pid-file=/var/run/dnsmasq.pid

# Set umask
#umask=0022

# Test configuration and exit
#test

# ==============================================================================
# END OF FULL-FEATURED CONFIGURATION
# ==============================================================================
