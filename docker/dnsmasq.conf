# dnsmasq configuration for Docker container deployment
# Optimized for container PID 1 execution and observability
#
# This configuration file provides container-friendly defaults for running
# dnsmasq in containerized environments (Docker, Kubernetes, etc.)
#
# To override these settings, use one of the following methods:
#   1. Mount custom config: -v /path/to/custom.conf:/etc/dnsmasq.conf:ro
#   2. Command-line override: docker run ... dnsmasq [options]
#   3. Environment variables: See entrypoint.sh for supported variables

# =============================================================================
# Container Execution Mode
# =============================================================================

# Run in foreground (required for proper container signal handling)
# This ensures dnsmasq runs as PID 1 and receives SIGTERM/SIGHUP directly
keep-in-foreground

# Disable PID file creation (not needed in containers)
no-pid-file

# Log to stderr for container log aggregation (Docker/Kubernetes)
# This allows logs to be captured by `docker logs` and forwarding to
# centralized logging systems
log-facility=-

# =============================================================================
# DNS Configuration
# =============================================================================

# Listen on all interfaces (default)
# In container networking, dnsmasq typically binds to container IP
# Override with: --interface=<name> if specific binding needed
#interface=

# Standard DNS port
port=53

# Never forward plain names (security best practice)
# Prevents forwarding of single-label names like "localhost", "printer"
domain-needed

# Never forward addresses in non-routed address spaces (RFC1918)
# Prevents forwarding of reverse lookups for private IPs
bogus-priv

# Don't read /etc/resolv.conf (upstream servers via environment variables)
# Container orchestration typically manages DNS resolution externally
no-resolv

# Don't poll /etc/resolv.conf for changes (static container config)
no-poll

# DNS cache size (entries)
# Default: 150 entries
# Can be overridden via CACHE_SIZE environment variable
cache-size=150

# Enable negative caching (cache NXDOMAIN responses)
# Reduces load on upstream DNS servers
neg-ttl=3600

# =============================================================================
# Query Logging (Observability)
# =============================================================================

# Log queries for debugging and observability
# Disabled by default, can be enabled via LOG_QUERIES=true environment variable
# Uncomment to enable:
#log-queries

# Additional query logging options for troubleshooting:
# Uncomment as needed for debugging
#log-dhcp
#log-async

# =============================================================================
# DHCP Configuration (Disabled by Default)
# =============================================================================

# DHCP services disabled in container mode by default
# Container networking (Docker bridge, Kubernetes CNI) handles IP assignment
# To enable DHCP, override via command-line:
#   docker run --cap-add=NET_ADMIN -p 67:67/udp ... [dhcp-range options]
#
# Example DHCP range (commented out):
#dhcp-range=192.168.1.50,192.168.1.150,12h

# =============================================================================
# DNSSEC Support (Optional)
# =============================================================================

# Enable DNSSEC validation (if compiled with DNSSEC feature)
# Requires trust anchors: /usr/share/dnsmasq/trust-anchors.conf
# Uncomment to enable:
#conf-file=/usr/share/dnsmasq/trust-anchors.conf
#dnssec
#dnssec-check-unsigned

# =============================================================================
# Security Hardening
# =============================================================================

# Bind only to specified interfaces (if configured)
# Default: bind to all interfaces
# Override with: --interface=<name> or --listen-address=<ip>
bind-interfaces

# Never forward A or AAAA queries for plain names
# This prevents information leakage for internal hostnames
domain-needed

# Filter private IP ranges from upstream responses (anti-rebind protection)
# Protects against DNS rebinding attacks
stop-dns-rebind

# Allow responses from localhost (needed for some container setups)
rebind-localhost-ok

# =============================================================================
# Performance Tuning
# =============================================================================

# Set DNS query timeout
# Default: 1 second per query
# Increase if upstream DNS servers are slow
#dns-forward-max=150

# Limit concurrent DNS queries
# Prevents resource exhaustion under high load
#dns-forward-max=150

# =============================================================================
# Local Name Resolution
# =============================================================================

# Expand bare names with domain suffix from DHCP
# Disabled in container mode (no local DHCP)
#expand-hosts

# Set domain for DHCP clients
# Example: domain=example.com
#domain=example.com

# Read /etc/hosts for local name resolution
# Useful for container-local hostname mapping
# Default: enabled
#no-hosts

# Read additional hosts files
# Useful for custom container hostname mappings
#addn-hosts=/etc/dnsmasq-hosts

# =============================================================================
# Container-Specific Notes
# =============================================================================

# Upstream DNS Servers:
# ---------------------
# Configure via UPSTREAM_DNS environment variable (comma-separated)
# Example: UPSTREAM_DNS="8.8.8.8,8.8.4.4,1.1.1.1"
# These are passed as --server=<ip> arguments by entrypoint.sh

# Custom Configuration:
# --------------------
# To add custom options without modifying this file:
#   1. Create config snippet: /etc/dnsmasq.d/custom.conf
#   2. Mount as volume: -v /path/to/custom.conf:/etc/dnsmasq.d/custom.conf:ro
#   3. dnsmasq will read all .conf files from /etc/dnsmasq.d/

# Read additional configuration from conf-dir
conf-dir=/etc/dnsmasq.d/,*.conf

# =============================================================================
# Runtime Override Examples
# =============================================================================

# Enable query logging:
#   docker run -e LOG_QUERIES=true ...
#
# Set cache size:
#   docker run -e CACHE_SIZE=1000 ...
#
# Add upstream DNS:
#   docker run -e UPSTREAM_DNS="8.8.8.8,1.1.1.1" ...
#
# Custom options:
#   docker run ... dnsmasq --log-queries --cache-size=500
#
# Mount custom config:
#   docker run -v /path/to/custom.conf:/etc/dnsmasq.conf:ro ...

# =============================================================================
# End of Configuration
# =============================================================================
